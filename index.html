
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ukhona — Ukubona LLC</title>
    <meta name="description" content="Ukubona LLC. Digital twins for customized care. Year Two." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Ukhona — Ukubona LLC" />
    <meta property="og:description" content="It is here. Ukubona LLC Year Two." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ngikhona.onrender.com" />
    <meta property="og:image" content="https://abikesa.github.io/logos/assets/ukubona-light.png" />

    <!-- Icons -->
    <link rel="icon" href="https://abikesa.github.io/favicon/assets/favicon-light.ico" />
    <link rel="icon" href="https://abikesa.github.io/favicon/assets/favicon-dark.ico"
          media="(prefers-color-scheme: dark)" />

    <!-- Logo preloads -->
    <link rel="preload" href="https://abikesa.github.io/logos/assets/ukubona-light.png" as="image" />
    <link rel="preload" href="https://abikesa.github.io/logos/assets/ukubona-dark.png" as="image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#f0efec;
  --txt:#111111;--txt2:#555555;--txt3:#999999;
  --brd:#e0e0de;--brd2:#ccccca;
  --grn:#1d9e74;--amb:#c8921a;--red:#e24b4a;
  --sel:#3a7bd5;
  --logo:url('https://abikesa.github.io/logos/assets/ukubona-light.png');
}
.dark{
  --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#222222;
  --txt:#f0f0f0;--txt2:#aaaaaa;--txt3:#666666;
  --brd:#333333;--brd2:#444444;
  --logo:url('https://abikesa.github.io/logos/assets/ukubona-dark.png');
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);transition:background .4s,color .4s}

/* Layout */
.page{max-width:700px;margin:0 auto;padding:0}

/* Header */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 1.25rem;
  border-bottom:1px solid var(--brd);
  background:var(--bg);
  gap:12px;
}
.logo-wrap{flex-shrink:0}
.logo{
  display:block;width:36px;height:36px;
  background:var(--logo) center/contain no-repeat;
  animation:spin 120s linear infinite;
}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.hdr-center{flex:1;min-width:0}
.hdr-title{font-size:13px;font-weight:500;color:var(--txt);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:11px;color:var(--txt3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tbtn{
  width:32px;height:32px;border-radius:50%;
  border:1px solid var(--brd2);background:var(--bg2);
  color:var(--txt2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;transition:background .2s,border-color .2s;
}
.tbtn:hover{background:var(--bg3);border-color:var(--brd2)}
.pbtn{
  font-size:11px;padding:5px 12px;
  border:1px solid var(--brd2);border-radius:6px;
  background:transparent;color:var(--txt2);cursor:pointer;
  display:flex;align-items:center;gap:5px;
  transition:background .15s;white-space:nowrap;
}
.pbtn:hover{background:var(--bg2)}
.tick{font-size:11px;color:var(--txt3);white-space:nowrap}

/* Body */
.body{padding:1.25rem}

/* Scalar */
.slabel{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-bottom:.25rem}
.sblock{display:flex;align-items:baseline;gap:16px;margin-bottom:.25rem;flex-wrap:wrap}
.sval{font-size:60px;font-weight:500;line-height:1;transition:color 2s}
.sverdict{font-size:13px;font-weight:500;margin-top:4px;transition:color 2s}
.ssub{font-size:12px;color:var(--txt3);margin-top:4px}
.sbar-wrap{height:5px;background:var(--bg3);border-radius:3px;margin:12px 0 1.5rem;overflow:hidden}
.sbar{height:100%;border-radius:3px;transition:width 3s,background 3s}

/* Lens */
.lens-bar{display:flex;gap:6px;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
.lens-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-right:4px}
.lbtn{font-size:11px;padding:4px 10px;border:1px solid var(--brd);border-radius:6px;background:transparent;color:var(--txt3);cursor:pointer;transition:all .15s}
.lbtn.active{background:var(--bg2);color:var(--txt);border-color:var(--brd2)}

/* Metric cards */
.mcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:1.5rem}
.mcard{background:var(--bg2);border-radius:8px;padding:.75rem 1rem;border:1px solid var(--brd)}
.mcard-lbl{font-size:10px;color:var(--txt3);margin-bottom:4px;letter-spacing:.04em}
.mcard-val{font-size:19px;font-weight:500;color:var(--txt)}

/* Section label */
.sec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin-bottom:.75rem}

/* Matrix */
.mx-wrap{overflow-x:auto;margin-bottom:1.5rem}
.mx{border-collapse:collapse;width:100%;min-width:420px}
.mx th{font-size:11px;color:var(--txt3);font-weight:400;text-align:center;padding:6px 4px;letter-spacing:.06em}
.mx th.rh{text-align:right;padding-right:10px}
.mx td.rl{font-size:11px;color:var(--txt3);text-align:right;padding-right:10px;white-space:nowrap}
.cell{width:76px;height:54px;border:1px solid var(--brd);text-align:center;cursor:pointer;transition:background .8s,color .8s,border-color .2s;position:relative;vertical-align:middle}
.cell:hover{border-color:var(--brd2);z-index:2}
.cell-v{font-size:15px;font-weight:500;display:block;line-height:1}
.cell-s{font-size:10px;display:block;margin-top:3px;opacity:.7}
.cell.sel{border:2px solid var(--sel)!important;z-index:3}
.diag{opacity:.25;cursor:default}

/* Detail panel */
.detail{background:var(--bg2);border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.5rem;border:1px solid var(--brd)}
.dh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.75rem;flex-wrap:wrap;gap:8px}
.dt{font-size:13px;font-weight:500;color:var(--txt)}
.dv{font-size:21px;font-weight:500;color:var(--txt)}
.cwrap{position:relative;width:100%;height:155px}
.up{color:#1d9e74}.dn{color:#e24b4a}

/* Footer */
.foot{
  padding:.75rem 1.25rem;
  border-top:1px solid var(--brd);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);
}
.foot-txt{font-size:10px;color:var(--txt3);letter-spacing:.06em;text-transform:uppercase}
</style>
 <body> 
<div class="page" id="page">

  <!-- HEADER -->
  <header class="hdr">
    <div class="logo-wrap">
      <div class="logo" role="img" aria-label="Ukubona logo"></div>
    </div>
    <div class="hdr-center">
      <div class="hdr-title">Ukubona · Organizational Twin</div>
      <div class="hdr-sub">Live Jacobian</div>
    </div>
    <div class="hdr-right">
      <button class="pbtn" id="playBtn" aria-label="Simulate drift">
        <i class="ti ti-player-play" aria-hidden="true"></i><span id="playLbl">Simulate drift</span>
      </button>
      <span class="tick" id="tickLbl">t = 0</span>
      <button class="tbtn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle light/dark">
        <i class="ti ti-moon" id="themeIcon" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <!-- BODY -->
  <main class="body">

    <div class="slabel">Health scalar · S(t)</div>
    <div class="sblock">
      <div class="sval" id="sVal">0.74</div>
      <div>
        <div class="sverdict" id="sVerdict">System healthy — decision gate open</div>
        <div class="ssub" id="sSub">S &gt; 0.50 · no intervention required</div>
      </div>
    </div>
    <div class="sbar-wrap"><div class="sbar" id="sBar" style="width:74%;background:#1d9e74"></div></div>

    <div class="lens-bar">
      <span class="lens-lbl">Lens:</span>
      <button class="lbtn active" data-role="all">All</button>
      <button class="lbtn" data-role="hr">HR</button>
      <button class="lbtn" data-role="ops">Ops</button>
      <button class="lbtn" data-role="fin">Finance</button>
      <button class="lbtn" data-role="exec">Executive</button>
      <button class="lbtn" data-role="comp">Compliance</button>
    </div>

    <div class="mcards" id="mcards"></div>

    <div class="sec">Jacobian J(t) — click any cell to drill into the feedback loop</div>
    <div class="mx-wrap">
      <table class="mx" id="mx" aria-label="4x4 Jacobian sensitivity matrix between organizational layers"></table>
    </div>

    <div class="detail" id="detail" style="display:none"></div>

  </main>

  <!-- FOOTER -->
  <footer class="foot">
    <span class="foot-txt">Ukubona LLC · Digital Twin Platform</span>
    <span class="foot-txt" id="footTick">t = 0 · drift paused</span>
  </footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const SHORT=['J_P','J_A','J_G','J_E'];
const DESC={
  J_P:'Infrastructure & capital',
  J_A:'Activation gate · decisions under uncertainty',
  J_G:'Generative output · error trace',
  J_E:'Embodied feedback · KPI → weight update'
};
const ROLE_W={
  all:[1,1,1,1],hr:[0.8,1.4,0.6,1.2],ops:[1.3,1.0,1.2,0.9],
  fin:[1.5,0.8,0.7,1.8],exec:[0.6,1.2,1.0,1.4],comp:[0.9,1.5,0.8,1.0]
};
const ROLE_METRICS={
  all:[
    {lbl:'Throughput index',fn:m=>((m[0][1]*m[1][2])*10).toFixed(2)},
    {lbl:'Feedback gain',fn:m=>((m[3][0]*m[3][1])*10).toFixed(2)},
    {lbl:'Gate λ',fn:m=>(1-m[1][2]*0.5).toFixed(2)},
    {lbl:'‖ε_FGT‖',fn:m=>(1-m[2][3]).toFixed(2)}
  ],
  hr:[
    {lbl:'Headcount coupling',fn:m=>m[3][0].toFixed(2)},
    {lbl:'Talent activation',fn:m=>m[1][2].toFixed(2)},
    {lbl:'Retention signal',fn:m=>((1-m[0][3])*100).toFixed(0)+'%'},
    {lbl:'Culture lag',fn:m=>m[3][1].toFixed(2)}
  ],
  ops:[
    {lbl:'Process throughput',fn:m=>((m[0][1]*m[1][2])*10).toFixed(2)},
    {lbl:'Delivery coupling',fn:m=>m[2][3].toFixed(2)},
    {lbl:'Bottleneck index',fn:m=>(1-m[1][2]).toFixed(2)},
    {lbl:'Feedback latency',fn:m=>m[3][0].toFixed(2)}
  ],
  fin:[
    {lbl:'Capital efficiency',fn:m=>(m[0][1]*100).toFixed(0)+'%'},
    {lbl:'Budget exposure',fn:m=>((1-m[2][3])*100).toFixed(0)+'%'},
    {lbl:'KPI coupling',fn:m=>m[3][2].toFixed(2)},
    {lbl:'Return signal',fn:m=>((m[0][2]+m[0][3])/2).toFixed(2)}
  ],
  exec:[
    {lbl:'Strategic alignment',fn:m=>((m[0][1]+m[1][2])/2).toFixed(2)},
    {lbl:'Decision gate',fn:m=>(1-m[1][2]*0.5).toFixed(2)},
    {lbl:'Org coherence',fn:m=>scalar(m).toFixed(2)},
    {lbl:'Eigenmode',fn:m=>scalar(m)>=0.65?'Stable':'Watch'}
  ],
  comp:[
    {lbl:'Gate compliance',fn:m=>m[1][0].toFixed(2)},
    {lbl:'Audit trail index',fn:m=>m[3][2].toFixed(2)},
    {lbl:'Risk exposure',fn:m=>((1-m[2][3])*100).toFixed(0)+'%'},
    {lbl:'Control coupling',fn:m=>m[0][3].toFixed(2)}
  ]
};

let tick=0,playing=false,timer=null,sel=null,role='all',dChart=null;
let dark=false;

function noise(b,a,t,f){return b+a*Math.sin(f*t+b*10)+a*0.3*Math.cos(f*1.7*t+2);}
function mat(t,r){
  const w=ROLE_W[r];
  const raw=[
    [0,noise(.60,.11,t,.4)*w[0],noise(.44,.17,t,.7)*w[0],noise(.37,.13,t,.5)*w[0]],
    [noise(.53,.14,t,.6)*w[1],0,noise(.70,.10,t,.3)*w[1],noise(.48,.16,t,.8)*w[1]],
    [noise(.41,.13,t,.9)*w[2],noise(.67,.11,t,.4)*w[2],0,noise(.80,.09,t,.2)*w[2]],
    [noise(.57,.15,t,.5)*w[3],noise(.43,.17,t,.7)*w[3],noise(.75,.10,t,.6)*w[3],0]
  ];
  return raw.map(r2=>r2.map(v=>Math.max(0,Math.min(1,v))));
}
function scalar(m){
  let s=0,n=0;
  for(let i=0;i<4;i++)for(let j=0;j<4;j++)if(i!==j){s+=m[i][j];n++;}
  return Math.min(.99,Math.max(.1,(s/n)*1.1+.05));
}
function scolor(s){return s>=.65?'#1d9e74':s>=.5?'#c8921a':'#e24b4a';}
function cellColor(v){
  if(v>=.7)return{bg:'#e1f5ee',txt:'#085041'};
  if(v>=.5)return{bg:'#faeeda',txt:'#633806'};
  if(v>=.3)return{bg:'#fbeaf0',txt:'#4b1528'};
  return{bg:'#fcebeb',txt:'#501313'};
}
function cellColorDark(v){
  if(v>=.7)return{bg:'#073d2e',txt:'#5eddb8'};
  if(v>=.5)return{bg:'#3d2a00',txt:'#f0b429'};
  if(v>=.3)return{bg:'#3d0e23',txt:'#f07ab0'};
  return{bg:'#3d0808',txt:'#f07070'};
}

function hist(r,c,t){
  const pts=[];
  for(let i=Math.max(0,t-19);i<=t;i++){pts.push({x:i,y:parseFloat(mat(i,role)[r][c].toFixed(3))});}
  return pts;
}

function renderMetrics(m){
  document.getElementById('mcards').innerHTML=
    ROLE_METRICS[role].map(d=>`<div class="mcard"><div class="mcard-lbl">${d.lbl}</div><div class="mcard-val">${d.fn(m)}</div></div>`).join('');
}

function renderMatrix(m){
  const tbl=document.getElementById('mx');
  let h='<thead><tr><th class="rh"></th>';
  SHORT.forEach(s=>{h+=`<th>${s}</th>`;});
  h+='</tr></thead><tbody>';
  for(let i=0;i<4;i++){
    h+=`<tr><td class="rl">${SHORT[i]}</td>`;
    for(let j=0;j<4;j++){
      const d=i===j;
      const v=m[i][j];
      const c=d?{bg:'transparent',txt:dark?'#444':'#ccc'}:(dark?cellColorDark(v):cellColor(v));
      const isSel=sel&&sel[0]===i&&sel[1]===j;
      h+=`<td class="cell${d?' diag':''}${isSel?' sel':''}" data-r="${i}" data-c="${j}" style="background:${c.bg};color:${c.txt}">
        <span class="cell-v">${d?'—':v.toFixed(2)}</span>
        ${!d?`<span class="cell-s">∂${SHORT[j]}/∂${SHORT[i]}</span>`:''}
      </td>`;
    }
    h+='</tr>';
  }
  tbl.innerHTML=h+'</tbody>';
  tbl.querySelectorAll('.cell:not(.diag)').forEach(cell=>{
    cell.addEventListener('click',()=>{
      sel=[+cell.dataset.r,+cell.dataset.c];
      renderMatrix(m);showDetail(sel[0],sel[1],m);
    });
  });
}

function showDetail(r,c,m){
  const panel=document.getElementById('detail');
  panel.style.display='block';
  const h=hist(r,c,tick);
  const cur=h[h.length-1].y;
  const prev=h.length>1?h[h.length-2].y:cur;
  const d=cur-prev;
  const ds=d===0?'':`<span class="${d>0?'up':'dn'}">${d>0?'↑':'↓'}${Math.abs(d).toFixed(3)}</span>`;
  panel.innerHTML=`
    <div class="dh">
      <div>
        <div class="dt">∂${SHORT[c]} / ∂${SHORT[r]} — how ${SHORT[r]} moves ${SHORT[c]}</div>
        <div style="font-size:11px;color:var(--txt3);margin-top:3px">${DESC[SHORT[r]]} → ${DESC[SHORT[c]]}</div>
      </div>
      <div style="display:flex;align-items:baseline;gap:6px"><div class="dv">${cur.toFixed(3)}</div>${ds}</div>
    </div>
    <div class="cwrap"><canvas id="dCanvas" role="img" aria-label="Time series of Jacobian cell sensitivity">Sensitivity over time.</canvas></div>
    <div style="font-size:11px;color:var(--txt3);margin-top:8px">High → strong coupling · Low → decoupled layers · Diagonal suppressed</div>
  `;
  if(dChart){dChart.destroy();dChart=null;}
  const col=scolor(cur);
  const gridCol=dark?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.07)';
  const tickCol=dark?'#555':'#999';
  dChart=new Chart(document.getElementById('dCanvas'),{
    type:'line',
    data:{labels:h.map(p=>p.x),datasets:[{
      label:`∂${SHORT[c]}/∂${SHORT[r]}`,data:h.map(p=>p.y),
      borderColor:col,backgroundColor:col+'22',fill:true,tension:0.4,
      pointRadius:3,pointBackgroundColor:col,borderWidth:2
    }]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{font:{size:10},color:tickCol},grid:{color:gridCol}},
        y:{min:0,max:1,ticks:{font:{size:10},color:tickCol},grid:{color:gridCol}}
      }
    }
  });
}

function render(){
  const m=mat(tick,role);
  const s=scalar(m);
  const col=scolor(s);
  document.getElementById('sVal').textContent=s.toFixed(2);
  document.getElementById('sVal').style.color=col;
  document.getElementById('sVerdict').textContent=s>=.65?'System healthy — decision gate open':s>=.5?'Variable — monitor activation gate':'S < 0.50 — intervention required';
  document.getElementById('sVerdict').style.color=col;
  document.getElementById('sSub').textContent=s>=.5?'S > 0.50 · no intervention required':'S < 0.50 · escalate to executive';
  document.getElementById('sBar').style.width=(s*100).toFixed(1)+'%';
  document.getElementById('sBar').style.background=col;
  document.getElementById('tickLbl').textContent='t = '+tick;
  document.getElementById('footTick').textContent='t = '+tick+(playing?' · drifting':' · drift paused');
  renderMatrix(m);renderMetrics(m);
  if(sel)showDetail(sel[0],sel[1],m);
}

document.getElementById('playBtn').addEventListener('click',()=>{
  playing=!playing;
  const btn=document.getElementById('playBtn');
  btn.querySelector('i').className=playing?'ti ti-player-pause':'ti ti-player-play';
  document.getElementById('playLbl').textContent=playing?'Pause':'Simulate drift';
  if(playing){timer=setInterval(()=>{tick++;render();},10000);}
  else{clearInterval(timer);}
  render();
});

document.querySelectorAll('.lbtn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.lbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');role=btn.dataset.role;render();
  });
});

document.getElementById('themeBtn').addEventListener('click',()=>{
  dark=!dark;
  document.getElementById('page').classList.toggle('dark',dark);
  document.body.classList.toggle('dark',dark);
  document.getElementById('themeIcon').className=dark?'ti ti-sun':'ti ti-moon';
  render();
});

render();

</script>
</body>
</html>
